<app-top-bar title="Ogólne" [showSettings]="false" backUrl="/settings" />

<div class="page page--narrow">
  <!-- KARTA PROFILU -->
  @if (profile(); as account) {
    <div class="card settings-profile">
      <span
        class="avatar avatar-lg"
        [style.background]="avatar(account.id).bg"
        [style.border-color]="avatar(account.id).border"
        [style.color]="avatar(account.id).text"
        aria-hidden="true"
      >
        {{ account.initials }}
      </span>

      <div>
        <p class="card__title">{{ account.firstName }} {{ account.lastName }}</p>
        <p class="hint">{{ account.email }}</p>
        <span class="badge" style="margin-top: 4px; background: #d1fae5; color: #065f46">
          {{ account.role === 'caregiver' ? 'Opiekun' : 'Pacjent' }}
        </span>
      </div>
    </div>
  }

  <!-- PREFERENCJE -->
  <h2 class="section-title">Preferencje i powiadomienia</h2>

  <label class="switch-row">
    <span class="icon-text">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8" />
        <path d="M13.7 21a2 2 0 0 1-3.4 0" />
      </svg>
      Powiadomienia o badaniach
    </span>
    <input
      type="checkbox"
      [checked]="notifications()"
      (change)="toggle('notifications')"
    />
  </label>

  <label class="switch-row">
    <span class="icon-text">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6z" />
      </svg>
      Logowanie FaceID / Biometria
    </span>
    <input type="checkbox" [checked]="biometrics()" (change)="toggle('biometrics')" />
  </label>

  <div class="switch-row">
    <span class="icon-text">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
      </svg>
      Język aplikacji
    </span>
    <span class="switch-row__value">Polski</span>
  </div>

  <!-- DANE -->
  <h2 class="section-title">Dane</h2>
  <button type="button" class="btn btn--ghost btn--block btn--sm" (click)="resetData()">
    <svg viewBox="0 0 24 24" style="width: 14px; height: 14px" aria-hidden="true">
      <path d="M20 11A8 8 0 0 0 6.3 6.3L4 8.5" />
      <path d="M4 4v4.5h4.5" />
      <path d="M4 13a8 8 0 0 0 13.7 4.7L20 15.5" />
      <path d="M20 20v-4.5h-4.5" />
    </svg>
    Zresetuj dane do domyślnych
  </button>
</div>
