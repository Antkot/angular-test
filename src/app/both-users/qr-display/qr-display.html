<section class="qr-display">
  <h1>Kod dostępu do profilu</h1>

  @if (localPatient(); as patient) {
    <p class="patient-name">{{ patient.name }}</p>
  }

  <canvas
    #qrCanvas
    width="280"
    height="280"
    role="img"
    aria-label="Kod QR profilu pacjenta"
  ></canvas>

  <p class="hint">Zeskanuj, aby uzyskać dostęp do profilu</p>

  <p class="patient-id">
    Identyfikator: <code>{{ patientId }}</code>
  </p>

  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }
</section>
