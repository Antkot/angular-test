<app-verify-header />

<main class="verify-view">
  <canvas
    #qrCanvas
    width="260"
    height="260"
    role="img"
    aria-label="Kod QR profilu pacjenta"
  ></canvas>

  <p class="instruction">
    @if (patient(); as account) {
      {{ account.firstName }} {{ account.lastName }}
    }
    <br />
    Zeskanuj ten kod QR<br />
    aplikacją opiekuna
  </p>

  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }
</main>
