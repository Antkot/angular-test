<div class="page page--tight">
  <!-- Powrót do logowania -->
  <button
    type="button"
    class="icon-button"
    style="margin-left: -8px; margin-bottom: 8px"
    (click)="goBack()"
    aria-label="Wróć do logowania"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" />
    </svg>
  </button>

  <h1 class="page-title">Wybierz konto</h1>

  @if (isLoading()) {
    <p class="hint">Ładowanie kont...</p>
  } @else {
    <div class="account-grid">
      @for (account of accounts(); track account.id) {
        <button
          type="button"
          class="account-tile"
          (click)="signIn(account)"
          [attr.aria-label]="
            'Zaloguj jako: ' + account.firstName + ' ' + account.lastName + ' (' + account.role + ')'
          "
        >
          <span
            class="account-tile__avatar"
            [style.background]="avatar(account.id).bg"
            [style.border-color]="avatar(account.id).border"
            [style.color]="avatar(account.id).text"
            aria-hidden="true"
          >
            {{ account.initials }}
          </span>
          <span class="account-tile__name">{{ account.firstName }} {{ account.lastName }}</span>
          <span class="account-tile__sub">
            {{ account.role === 'caregiver' ? 'Opiekun' : 'Senior' }}
          </span>
        </button>
      }

      <button
        type="button"
        class="account-tile"
        (click)="openAddModal()"
        aria-label="Dodaj nowe konto"
      >
        <span class="account-tile__avatar account-tile__avatar--dashed" aria-hidden="true">+</span>
        <span class="account-tile__name">Nowy użytkownik</span>
      </button>
    </div>
  }
</div>

@if (isAddModalOpen()) {
  <div
    class="modal-backdrop"
    role="presentation"
    (click)="closeOnBackdrop($event)"
    (keydown.escape)="closeAddModal()"
  >
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="account-modal-title">
      <header class="modal__head">
        <span class="icon-text icon-text--brand">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 19v-2M9 19v-2M4 15v-3M20 15v-3M12 5v10M7 9l5-4 5 4" />
            <circle cx="12" cy="5" r="2" />
          </svg>
          <span class="modal__title" id="account-modal-title">Nowy użytkownik</span>
        </span>
        <button
          type="button"
          class="icon-button icon-button--sm"
          (click)="closeAddModal()"
          aria-label="Zamknij okno"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <form (submit)="createAccount($event)">
        <!-- Podgląd awatara -->
        <div class="modal__avatar">
          <span
            class="account-tile__avatar"
            [style.background]="avatarPreview().bg"
            [style.border-color]="avatarPreview().border"
            [style.color]="avatarPreview().text"
            aria-hidden="true"
          >
            {{ initialsPreview() }}
          </span>
        </div>

        <div class="field">
          <span class="field__label">Imię i nazwisko</span>
          <input
            class="input"
            name="fullName"
            type="text"
            placeholder="np. Anna Nowak"
            required
            (input)="onNameInput($event)"
          />
        </div>

        <div class="field">
          <span class="field__label">Adres e-mail</span>
          <input
            class="input"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="np. anna.nowak@gmail.com"
          />
        </div>

        <div class="field">
          <span class="field__label">Rola profilu</span>
          <div class="role-picker">
            <button
              type="button"
              class="role-option"
              [class.is-active]="newRole() === 'senior'"
              (click)="newRole.set('senior')"
            >
              Pacjent
            </button>
            <button
              type="button"
              class="role-option"
              [class.is-active]="newRole() === 'caregiver'"
              (click)="newRole.set('caregiver')"
            >
              Opiekun
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn--pill btn--block" style="margin-top: 16px">
          Utwórz konto
        </button>
      </form>
    </section>
  </div>
}
