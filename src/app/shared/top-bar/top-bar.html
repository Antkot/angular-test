<header class="topbar">
  <span class="topbar__slot">
    @if (showBack()) {
      <button type="button" class="icon-button" (click)="goBack()" aria-label="Wróć">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 5l-7 7 7 7" />
        </svg>
      </button>
    }
  </span>

  <h1 class="topbar__title">{{ title() }}</h1>

  <span class="topbar__slot topbar__slot--end">
    @if (actionLabel()) {
      <button type="button" class="topbar-action" (click)="action.emit()">
        {{ actionLabel() }}
      </button>
    } @else if (showSettings()) {
      <a
        class="icon-button icon-button--sm"
        routerLink="/settings"
        aria-label="Ustawienia"
        title="Ustawienia"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3.2" />
          <path
            d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M17.8 6.2l-1.4 1.4M7.6 16.4l-1.4 1.4M17.8 17.8l-1.4-1.4M7.6 7.6L6.2 6.2"
          />
        </svg>
      </a>
    }
  </span>
</header>
